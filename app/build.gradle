apply plugin: 'com.android.application'

// LURVETA Performance — single source of truth for the package identity.
// NOTE: "/data/data/<appId>/files/rtfs" must stay exactly as long as the upstream
// "/data/data/com.winlator/files/rootfs" (36 bytes); see PathRelocator.java.
def lurvetaAppId = 'com.lurveta.co'

android {
    // The Java namespace stays com.winlator (internal, not user-visible); the installed
    // package is the LURVETA applicationId.
    namespace 'com.winlator'
    compileSdk 35

    defaultConfig {
        applicationId lurvetaAppId
        minSdkVersion 26
        targetSdkVersion 28
        versionCode 1
        versionName "1.0.0"

        buildConfigField 'String', 'PRODUCT_NAME', '"LURVETA Performance"'
        buildConfigField 'String', 'UPSTREAM_BASE', '"Winlator 11.2 (winlator-app@a030f55)"'
        buildConfigField 'String', 'SOURCE_URL', '"https://github.com/UpgamesStudio/lurveta-performance"'

        externalNativeBuild {
            cmake {
                arguments "-DAPP_ID=${lurvetaAppId}"
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }

    ndkVersion '24.0.8215888'

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.20'
    implementation 'androidx.lifecycle:lifecycle-process:2.5.1'
}
